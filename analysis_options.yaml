include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # The Serverpod backend has its own analysis_options and its own lint
    # baseline (including `name: _` on its workspace root, which is a Serverpod
    # convention). Formatting or analysing it from here reaches across a
    # boundary it does not own.
    - server/**
    # Rewritten wholesale by `serverpod generate`; never edited by hand.
    - packages/book_marker_client/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - always_use_package_imports
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - require_trailing_commas
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_null_checks

formatter:
  page_width: 100
  trailing_commas: preserve
