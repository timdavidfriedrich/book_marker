# Append to /home/informaten/workspaces/global-gateway/Caddyfile, then:
#   docker compose -f /home/informaten/workspaces/global-gateway/docker-compose.yml restart caddy
#
# Reached by network alias over the shared `global-proxy` network, matching the
# existing `reverse_proxy openclaw-gateway:18789` pattern. No host ports are
# involved, so the VPS's occupied :8080 is irrelevant.
#
# Single-label subdomains on purpose: Cloudflare's free Universal SSL covers the
# apex plus ONE label (*.timdavidfriedrich.de). A nested name such as
# api.book-marker.timdavidfriedrich.de would need Advanced Certificate Manager.

book-marker-api.timdavidfriedrich.de {
    reverse_proxy book-marker-serverpod:8080
}

book-marker-sync.timdavidfriedrich.de {
    # PowerSync holds long-lived streaming connections; do not buffer them.
    reverse_proxy book-marker-powersync:8080 {
        flush_interval -1
    }
}
