# Runtime configuration - the single source of truth for every value you might
# want to change in production without a deploy or an app release.
#
# The server reads this to ENFORCE. The app reads the same values (via
# ConfigEndpoint) to DISPLAY. Keeping one copy is what stops the two drifting.
#
# Served unauthenticated, so it must work before sign-in. NOTHING SECRET GOES
# HERE - API keys live in config/passwords.yaml. Treat every value in this file
# as though it were already visible in a decompiled APK.
#
# Edit on the host and the change applies on the next request; the file is
# mounted into the container, not baked into the image.

version: 1

plans:
  free:
    ocrPerDay: 3
    ocrPerWeek: 10
    ocrPerMonth: 20
    maxImageBytes: 2097152
    maxAttachmentBytes: 2097152
    attachmentsEnabled: false
  premium:
    ocrPerDay: 50
    ocrPerWeek: 250
    ocrPerMonth: 500
    maxImageBytes: 2097152
    maxAttachmentBytes: 2097152
    attachmentsEnabled: true

sync:
  # Guards against a runaway client, not a monetisation gate. Every signed in
  # account syncs rows regardless of plan.
  maxWritesPerBatch: 500
  maxRowsPerTable: 100000

attachments:
  # Read at BOOT, not per request: the storage backend is registered with
  # Serverpod once at startup, so changing it needs a restart.
  #
  # minio, or database to keep blobs in Postgres with no object store at all.
  provider: database
  bucket: book-marker-attachments
  region: us-east-1
  endpoint: http://minio:9000

recognition:
  # gemini, or echo to exercise the quota path with no API key and no billing
  provider: gemini
  model: gemini-2.5-flash-lite
  # false until the marking screen can render a result that has no word boxes.
  # The cloud path returns a transcription and no geometry, and the tap-a-word
  # correction UI is built entirely on ML Kit's boxes. Flip this when it can.
  cloudEnabledByDefault: false

client:
  minSupportedVersion: "0.1.0"
  maintenanceMode: false
  maintenanceMessage: null
