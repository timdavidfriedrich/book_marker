services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    # * wal_level=logical is what lets PowerSync consume a replication slot
    command: ["postgres", "-c", "wal_level=logical"]
    restart: unless-stopped
    ports:
      # * bound to loopback: Caddy is the only thing that may reach this host
      - "127.0.0.1:8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: book_marker
      POSTGRES_PASSWORD: "qN7K0_oW0twni8BgKlkqqGAonRkiZ6h3"
    volumes:
      - book_marker_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_marker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6.2.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:6379"
    command: redis-server --requirepass "tcp7_Zwt40tVRMXuPk7ly20dzqoJ4urV"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: book_marker_test
      POSTGRES_PASSWORD: "pSK293g4_FrNABXiR9Ibpz7DF35HAouN"
    volumes:
      - book_marker_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "InUUDe3RuvEOWf_vox54A-YtvSFuIEdn"
    environment:
      - REDIS_REPLICATION_MODE=master

  # PowerSync sync service. Replicates from the Serverpod database above and
  # serves the sync API. Bucket storage is a SEPARATE database on the same
  # server (powersync_storage) - it must be created by hand once, see the plan.
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    volumes:
      - ./powersync:/config
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_SOURCE_URI: "${PS_SOURCE_URI}"
      PS_STORAGE_URI: "${PS_STORAGE_URI}"
      PS_JWK_N: "${PS_JWK_N}"
      PS_JWK_E: "${PS_JWK_E}"
      PS_JWK_KID: "${PS_JWK_KID}"
      PS_PORT: "8080"
      NODE_OPTIONS: --max-old-space-size=1000
    ports:
      - "127.0.0.1:8095:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 15

volumes:
  book_marker_data:
  book_marker_test_data:
