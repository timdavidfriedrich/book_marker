name: book_marker
description: Book Marker
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

workspace:
  - packages/core
  - packages/shared
  - packages/feature_capture
  - packages/feature_library
  - packages/feature_themes

dependencies:
  flutter:
    sdk: flutter

  core:
  shared:
  feature_capture:
  feature_library:
  feature_themes:
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^18.0.0
  injectable: ^3.0.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
